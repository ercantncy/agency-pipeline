[project]
name = "agency-pipeline"
version = "0.1.0"
description = "Multi-source ad/web data -> warehouse -> modeled marts -> white-label client reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "plotly>=5.22",
    "anthropic>=0.40",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-bigquery>=1.8",
]

[project.scripts]
agency-pipeline = "agency_pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
